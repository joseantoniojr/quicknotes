<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Jose Junior">
    <meta name="description" content="Aplicação web responsiva para gerenciamento e organização de notas.">

    <title>Quick Notes</title>

    <!-- Favicon -->
    <link rel="shortcut icon" href="favicon.png" type="image/png">

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/main.css">

    <!-- Javascript -->
    <script src="./js/app.js" defer></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>
    <header>
        <h1>Quick Notes</h1>

        <nav aria-label="Ações das notas">
            <button type="button" aria-label="Filtrar Favoritos">
                <i data-lucide="star"></i>
            </button>

            <button type="button" aria-label="Alterar Tema">
                <i data-lucide="sun"></i>
            </button>

            <button type="button" aria-label="Adicionar Nota">
                <i data-lucide="plus"></i>
                <span>Adicionar Nota</span>
            </button>
        </nav>
    </header>

    <script>lucide.createIcons();</script>
</body>

</html>
